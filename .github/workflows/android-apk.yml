name: Build The First Crush Native Android APK V5
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'android-native/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build-native-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build native V5 APK
        working-directory: android-native
        run: gradle assembleDebug
      - name: Upload native V5 APK
        uses: actions/upload-artifact@v4
        with:
          name: The-First-Crush-V5-Native-Android-APK
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
