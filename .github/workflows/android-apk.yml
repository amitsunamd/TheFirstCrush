name: Build The First Crush Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Capacitor dependencies
        working-directory: android-wrapper
        run: npm install
      - name: Generate Android project and sync current app
        working-directory: android-wrapper
        run: |
          npx cap add android
          npx cap sync android
      - name: Generate Gradle wrapper
        working-directory: android-wrapper/android
        run: gradle wrapper --gradle-version 8.9
      - name: Build APK from current web app
        working-directory: android-wrapper/android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: The-First-Crush-Android-APK
          path: android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
