name: Build The First Crush Native Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build-native-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate Gradle wrapper
        working-directory: android-native
        run: gradle wrapper --gradle-version 8.9
      - name: Build native Android APK
        working-directory: android-native
        run: ./gradlew assembleDebug
      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: The-First-Crush-Native-Android-APK
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
